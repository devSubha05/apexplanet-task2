<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>Nook: Create account</title></head>
<body class="register-page d-flex flex-column min-vh-100">
<!-- Floating Background Shapes -->
<span class="register-bg-shape reg-shape-1"></span>
<span class="register-bg-shape reg-shape-2"></span>
<span class="register-bg-shape reg-shape-3"></span>
<span class="register-bg-shape reg-shape-4"></span>
<span class="register-bg-shape reg-shape-5"></span>
<!-- Floating Particles -->
<span class="register-particle rp1"></span>
<span class="register-particle rp2"></span>
<span class="register-particle rp3"></span>
<span class="register-particle rp4"></span>
<span class="register-particle rp5"></span>
<span class="register-particle rp6"></span>
<span class="register-particle rp7"></span>

<div id="navbar"></div>
<main class="auth-wrap row g-0 flex-grow-1">
  <aside class="auth-side col-md-5 d-none d-md-flex flex-column justify-content-center p-5">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <h2 class="position-relative">Start writing in a minute.</h2>
    <p class="position-relative fs-5 mb-0">One account for all your notes, on every device.</p>
  </aside>
  <section class="register-form-section col-12 col-md-7 d-flex align-items-center justify-content-center p-4">
    <div class="auth-card">
      <h1 class="h2 fw-bold">Create account</h1>
      <p class="text-muted">Already registered? <a href="login.html">Log in</a></p>
      <form id="registerForm" novalidate>
        <div class="mb-3"><label class="form-label" for="fullname">Full name</label>
          <input class="form-control" id="fullname" name="fullname" autocomplete="name"><div class="invalid-feedback"></div></div>
        <div class="row">
          <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" autocomplete="username"><div class="invalid-feedback"></div>
            <div class="check-msg" id="usernameMsg"></div></div>
          <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email"><div class="invalid-feedback"></div>
            <div class="check-msg" id="emailMsg"></div></div>
        </div>
        <div class="mb-3"><label class="form-label" for="regPass">Password</label>
          <div class="input-group has-validation">
            <input class="form-control" id="regPass" name="password" type="password" autocomplete="new-password">
            <button class="btn btn-eye" type="button" data-toggle-password="regPass" aria-label="Show password"><i class="bi bi-eye"></i></button>
            <div class="invalid-feedback"></div></div>
          <div class="strength mt-2"><div id="strengthBar"></div></div></div>
        <div class="mb-3"><label class="form-label" for="confirm">Confirm password</label>
          <div class="input-group has-validation">
            <input class="form-control" id="confirm" name="confirm" type="password" autocomplete="new-password">
            <button class="btn btn-eye" type="button" data-toggle-password="confirm" aria-label="Show password"><i class="bi bi-eye"></i></button>
            <div class="invalid-feedback"></div></div></div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="terms" name="terms">
          <label class="form-check-label" for="terms">I agree to the terms of use</label>
          <div class="invalid-feedback">Accept the terms to continue.</div></div>
        <button class="btn btn-brand w-100 py-2" type="submit">Create account</button>
      </form>
    </div>
  </section>
</main>
<div class="modal fade" id="successModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content text-center p-4">
<i class="bi bi-check-circle-fill display-4 text-success"></i><h4 class="mt-2">You are in</h4>
<!-- <p class="text-muted mb-3">Frontend demo only: the form passed validation. No data was sent.</p> -->
<button class="btn btn-brand" data-bs-dismiss="modal">Close</button></div></div></div>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
</body></html>
