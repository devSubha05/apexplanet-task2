<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>UserPulse: Log in</title></head>
<body class="d-flex flex-column min-vh-100 login-page">

<!-- Animated Background Shapes -->
<div class="login-bg-shape login-shape-1"></div>
<div class="login-bg-shape login-shape-2"></div>
<div class="login-bg-shape login-shape-3"></div>
<div class="login-bg-shape login-shape-4"></div>

<!-- Floating Particles -->
<div class="login-particle p1"></div>
<div class="login-particle p2"></div>
<div class="login-particle p3"></div>
<div class="login-particle p4"></div>
<div class="login-particle p5"></div>
<div class="login-particle p6"></div>

<div id="navbar"></div>
<main class="auth-wrap row g-0 flex-grow-1 position-relative z-1">
  <aside class="auth-side col-md-5 d-none d-md-flex flex-column justify-content-center p-5">
    <span class="blob b1"></span><span class="blob b2"></span>
    <span class="blob b3"></span>
    <h2 class="position-relative">Welcome back.</h2>
    <p class="position-relative fs-5 mb-0">Your notes are right where you left them.</p>
  </aside>
  <section class="col-12 col-md-7 d-flex align-items-center justify-content-center p-4 login-form-section">
    <div class="auth-card">
      <h1 class="h2 fw-bold">Log in</h1>
      <p class="text-muted">New here? <a href="register.html">Create an account</a></p>
      <form id="loginForm" novalidate>
        <div class="mb-3"><label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" name="email" type="email" autocomplete="email">
          <div class="invalid-feedback"></div></div>
        <div class="mb-3"><label class="form-label" for="password">Password</label>
          <div class="input-group has-validation">
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password">
            <button class="btn btn-eye" type="button" data-toggle-password="password" aria-label="Show password"><i class="bi bi-eye"></i></button>
            <div class="invalid-feedback"></div></div></div>
        <button class="btn btn-brand w-100 py-2 mt-2" type="submit">Log in</button>
      </form>
    </div>
  </section>
</main>
<div class="modal fade" id="successModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content text-center p-4">
<i class="bi bi-check-circle-fill display-4 text-success"></i><h4 class="mt-2">Login Successfully</h4>
<button class="btn btn-brand" data-bs-dismiss="modal">Close</button></div></div></div>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
</body></html>
